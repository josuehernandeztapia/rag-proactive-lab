timezone: America/Mexico_City
paths:
  devices: data/staging/geotab_devices.csv
  faults: data/staging/geotab_faults.csv
  telemetry_summary: data/telemetry_summary_from_geotab.csv
  pia_features: data/processed/pia/pia_features_augmented.csv
  trips_daily: data/staging/geotab_trip_daily.csv
  output: data/processed/guardian/guardian_insights.csv
  outbox: reports/guardian_outbox.jsonl
alerts:
  downtime:
    min_hours_30d: 120
    min_activity_drop_pct: 0.35
    lookback_days: 30
    severity: high
  consumption:
    drop_pct_threshold: 0.25
    min_litros_30d: 200
    lookback_days: 30
    severity: medium
  inactivity:
    min_activity_drop_pct: 0.45
    lookback_days: 14
    severity: medium
  safety:
    seatbelt_rate_threshold: 0.36
    high_speed_ratio_threshold: 0.38
    severity: high
  idle:
    idle_ratio_threshold: 0.60
    severity: medium
  after_hours:
    ratio_threshold: 0.35
    min_km_30d: 80
    severity: medium
  telemetry:
    max_health_score: 0.40
    severity: high
  driving:
    harsh_event_ids:
    - DiagnosticAccidentLevelAccelerationEventId
    - aUwYkR8e7SUcv81plk3q2Bg
    - a1Tk3wGv3V4SW1t3sDbpsjw
    min_events: 3
    lookback_days: 7
    severity: medium
  dtc:
    include_pending: true
    max_age_days: 14
    min_repeat: 1
    severity_map:
      MaintenanceOnly: medium
      CriticalOnly: high
      Safety: high
      default: medium
    fallback_severity: medium
  autohandoff:
    telemetry_health: postventa_soporte
    telemetry: postventa_soporte
    downtime: postventa_soporte
    off_hours_usage: postventa_soporte
    after_hours: postventa_soporte
    idle: postventa_soporte
    geofence: postventa_soporte
    energy: postventa_soporte
    safety: postventa_tecnico
    dtc: postventa_tecnico
    driving: postventa_tecnico
    consumption: pia
  autohandoff_rules:
    postventa_soporte:
      auto_escalate: true
      channels:
      - slack
      - ticket
    postventa_tecnico:
      auto_escalate: true
      channels:
      - ticket
    pia:
      auto_escalate: true
      channels:
      - alert_hub
geofence:
  enabled: false
  safe_zones:
  - id: patio_principal
    geotab_zone_id: b201
  - id: taller
    geotab_zone_id: b3f2
  max_minutes_outside: 45
  notify_if_outside_working_hours: true
telemetry_health:
  max_minutes_without_data: 90
  min_signal_strength: 2
  alert_severity: high
off_hours_usage:
  working_window:
    start: 06:00
    end: '22:00'
    timezone: America/Mexico_City
  max_trips_off_hours: 2
  max_km_off_hours: 50
energy_monitoring:
  enabled: false
  min_state_of_charge: 0.25
  consumption_drop_pct: 0.3
  lookback_days: 14
